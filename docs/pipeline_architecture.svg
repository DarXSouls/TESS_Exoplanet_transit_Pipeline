<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">TESS Exoplanet Transit Pipeline Architecture</title>
  <desc id="desc">Public TOI and eclipsing binary catalogs are standardized into a master catalog. Master catalog and TESS observations feed raw FITS files and metadata, followed by data validation, flux selection and normalization, sector-wise detrending, and prepared light curves.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <style>
      .heading { font: 700 28px Arial, Helvetica, sans-serif; fill: #172b4d; }
      .subheading { font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; fill: #526782; }
      .label { font: 600 18px Arial, Helvetica, sans-serif; fill: #20334d; text-anchor: middle; }
      .small { font: 500 16px Arial, Helvetica, sans-serif; fill: #20334d; text-anchor: middle; }
      .node { fill: #eef4fb; stroke: #6685ad; stroke-width: 2; }
      .process { fill: #f7f9fc; stroke: #7c8da5; stroke-width: 2; }
      .output { fill: #e2f6e9; stroke: #329764; stroke-width: 2.5; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#ffffff" />
  <text x="600" y="48" class="heading" text-anchor="middle">TESS Exoplanet Transit Pipeline</text>
  <text x="600" y="78" class="subheading" text-anchor="middle">PIPELINE ARCHITECTURE</text>

  <!-- Catalog branch -->
  <rect x="110" y="112" width="430" height="385" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="325" y="145" class="subheading" text-anchor="middle">CATALOG PREPARATION</text>

  <rect class="node" x="165" y="170" width="320" height="74" rx="10" />
  <text class="label" x="325" y="199">
    <tspan x="325" dy="0">Public TOI and Eclipsing</tspan>
    <tspan x="325" dy="23">Binary Catalogs</tspan>
  </text>
  <path class="connector" d="M325 244 V274" />

  <rect class="process" x="165" y="282" width="320" height="66" rx="10" />
  <text class="label" x="325" y="322">Catalog Standardization</text>
  <path class="connector" d="M325 348 V378" />

  <rect class="process" x="165" y="386" width="320" height="66" rx="10" />
  <text class="label" x="325" y="426">Master Catalog</text>

  <!-- TESS input -->
  <rect x="660" y="330" width="390" height="122" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="855" y="360" class="subheading" text-anchor="middle">OBSERVATIONAL INPUT</text>
  <rect class="node" x="705" y="375" width="300" height="58" rx="10" />
  <text class="label" x="855" y="411">TESS Observations</text>

  <!-- Merge to raw data -->
  <path class="connector" d="M325 452 V530 H480 V559" />
  <path class="connector" d="M855 433 V510 H720 V559" />
  <rect class="process" x="390" y="568" width="420" height="74" rx="11" />
  <text class="label" x="600" y="598">
    <tspan x="600" dy="0">Raw FITS Light Curves</tspan>
    <tspan x="600" dy="23">and Metadata</tspan>
  </text>

  <!-- Processing pipeline -->
  <path class="connector" d="M600 642 V680" />
  <rect class="process" x="390" y="689" width="420" height="66" rx="11" />
  <text class="label" x="600" y="729">Data Validation and Quality Checks</text>

  <path class="connector" d="M600 755 V790" />
  <rect class="process" x="390" y="799" width="420" height="66" rx="11" />
  <text class="label" x="600" y="827">
    <tspan x="600" dy="0">Flux Selection</tspan>
    <tspan x="600" dy="22">and Normalization</tspan>
  </text>

  <path class="connector" d="M600 865 V900" />
  <rect class="process" x="390" y="909" width="420" height="66" rx="11" />
  <text class="label" x="600" y="949">Sector-Wise Detrending</text>

  <path class="connector" d="M600 975 V1010" />
  <rect class="output" x="390" y="1019" width="420" height="66" rx="11" />
  <text class="label" x="600" y="1059">Prepared Light Curves</text>
</svg>
