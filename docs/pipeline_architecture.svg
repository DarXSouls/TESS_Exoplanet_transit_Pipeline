<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" role="img" aria-labelledby="title desc">
  <title id="title">TESS Exoplanet Transit Pipeline Architecture</title>
  <desc id="desc">Catalogs are standardized into a master catalog and joined with TESS observations to organize raw FITS light curves and metadata. The current workflow includes quality checks, flux selection and normalization, sector-wise detrending, and prepared light curves. Planned next stages are BLS transit search, candidate event identification, feature extraction, candidate classification and vetting, and results export.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#61738a"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 25px; font-weight: 700; fill: #172b4d; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #465b75; }
      .label { font-size: 15px; font-weight: 600; fill: #20334d; text-anchor: middle; }
      .small { font-size: 13px; font-weight: 600; fill: #20334d; text-anchor: middle; }
      .node { fill: #eaf1fb; stroke: #6586b1; stroke-width: 1.6; }
      .process { fill: #f8fafc; stroke: #8796aa; stroke-width: 1.5; }
      .output { fill: #dff5e8; stroke: #329764; stroke-width: 1.8; }
      .planned { fill: #fffaf0; stroke: #b98a42; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #61738a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-planned { fill: none; stroke: #ad8243; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect width="1000" height="875" fill="#ffffff"/>
  <text class="title" x="500" y="34" text-anchor="middle">TESS Exoplanet Transit Pipeline</text>

  <!-- Inputs and catalog preparation -->
  <rect x="35" y="52" width="600" height="128" rx="12" fill="#f7f9fc" stroke="#c7d2e0" stroke-width="1.4"/>
  <text class="section" x="335" y="72" text-anchor="middle">CATALOG PREPARATION</text>
  <rect class="node" x="52" y="91" width="170" height="62" rx="8"/>
  <text class="small" x="137" y="116"><tspan x="137">Public TOI and</tspan><tspan x="137" dy="17">EB Catalogs</tspan></text>
  <path class="arrow" d="M222 122 H241"/>
  <rect class="process" x="246" y="91" width="170" height="62" rx="8"/>
  <text class="small" x="331" y="116"><tspan x="331">Catalog</tspan><tspan x="331" dy="17">Standardization</tspan></text>
  <path class="arrow" d="M416 122 H435"/>
  <rect class="process" x="440" y="91" width="178" height="62" rx="8"/>
  <text class="small" x="529" y="126">Master Catalog</text>

  <rect x="700" y="72" width="265" height="92" rx="12" fill="#f7f9fc" stroke="#c7d2e0" stroke-width="1.4"/>
  <text class="section" x="832.5" y="92" text-anchor="middle">OBSERVATIONAL INPUT</text>
  <rect class="node" x="725" y="104" width="215" height="44" rx="8"/>
  <text class="label" x="832.5" y="131">TESS Observations</text>

  <!-- Inputs merge into raw data -->
  <path class="arrow" d="M529 153 V196 H430 V207"/>
  <path class="arrow" d="M832 148 V190 H570 V207"/>
  <rect class="process" x="325" y="210" width="350" height="44" rx="8"/>
  <text class="label" x="500" y="228"><tspan x="500">Raw FITS Light Curves</tspan><tspan x="500" dy="17">and Metadata</tspan></text>

  <!-- Current implementation -->
  <rect x="205" y="271" width="590" height="229" rx="13" fill="#f6f9fc" stroke="#9aabba" stroke-width="1.5"/>
  <text class="section" x="225" y="292" text-anchor="start">CURRENT WORKFLOW</text>
  <path class="arrow" d="M500 254 V309"/>

  <rect class="process" x="300" y="311" width="400" height="36" rx="7"/>
  <text class="label" x="500" y="334">Data Validation and Quality Checks</text>
  <path class="arrow" d="M500 347 V357"/>

  <rect class="process" x="300" y="359" width="400" height="36" rx="7"/>
  <text class="label" x="500" y="382">Flux Selection and Normalization</text>
  <path class="arrow" d="M500 395 V405"/>

  <rect class="process" x="300" y="407" width="400" height="36" rx="7"/>
  <text class="label" x="500" y="430">Sector-Wise Detrending</text>
  <path class="arrow" d="M500 443 V453"/>

  <rect class="output" x="300" y="455" width="400" height="36" rx="7"/>
  <text class="label" x="500" y="478">Prepared Light Curves</text>

  <!-- Planned stages -->
  <rect x="205" y="507" width="590" height="323" rx="13" fill="#fffcf5" stroke="#c79a55" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text class="section" x="225" y="529" text-anchor="start" fill="#8a622a">PLANNED / UNDER DEVELOPMENT</text>
  <path class="arrow-planned" d="M500 491 V545"/>

  <rect class="planned" x="300" y="548" width="400" height="42" rx="7"/>
  <text class="label" x="500" y="574">BLS Transit Search</text>
  <path class="arrow-planned" d="M500 590 V599"/>

  <rect class="planned" x="300" y="601" width="400" height="42" rx="7"/>
  <text class="label" x="500" y="627">Candidate Event Identification</text>
  <path class="arrow-planned" d="M500 643 V652"/>

  <rect class="planned" x="300" y="654" width="400" height="42" rx="7"/>
  <text class="label" x="500" y="680">Feature Extraction</text>
  <path class="arrow-planned" d="M500 696 V705"/>

  <rect class="planned" x="300" y="707" width="400" height="42" rx="7"/>
  <text class="label" x="500" y="733">Candidate Classification and Vetting</text>
  <path class="arrow-planned" d="M500 749 V758"/>

  <rect class="planned" x="300" y="760" width="400" height="42" rx="7"/>
  <text class="label" x="500" y="786">Candidate Metrics and Results Export</text>

  <text x="500" y="853" text-anchor="middle" font-size="12" fill="#66758a">Solid border: current workflow  •  Dashed group: planned stages</text>
</svg>
